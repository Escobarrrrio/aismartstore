name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The root tsconfig.json is solution-style ("files": [], only
      # "references") -- `tsc --noEmit` against it checks zero files and
      # always exits 0, silently skipping every type error in the repo.
      # `--build` is the mode that actually traverses tsconfig.app.json and
      # tsconfig.node.json and checks their contents.
      - name: Type-check
        run: npx tsc --build --force

      - name: No stray platform/assistant-name references
        run: npm run check:no-platform-refs

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          VITE_SUPABASE_PROJECT_ID: "placeholder"

      - name: Report bundle size
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js | sort -rh | head -10 >> "$GITHUB_STEP_SUMMARY"
