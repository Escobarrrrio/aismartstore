name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The dependency scanner can only read TEXT lockfiles. If bun.lock is
      # missing (or someone committed the binary bun.lockb instead), a
      # vulnerable package could ship unnoticed because nothing can parse the
      # resolved versions. Regenerate as text and fail the build if that
      # produces a diff, so the fix lands in the repo rather than only in CI.
      - name: Verify text lockfile
        run: |
          set -e
          if [ -f bun.lockb ] || [ ! -f bun.lock ]; then
            echo "::warning::Text lockfile missing or binary bun.lockb present — regenerating."
            bun install --save-text-lockfile
            rm -f bun.lockb
          fi
          bun install --save-text-lockfile --frozen-lockfile 2>/dev/null || bun install --save-text-lockfile
          if ! git diff --quiet -- bun.lock bun.lockb package.json; then
            echo "::error::bun.lock is out of date or not in text format. Run 'bun install --save-text-lockfile' and commit the result."
            git diff --stat -- bun.lock bun.lockb package.json
            exit 1
          fi
          echo "Text lockfile present and up to date."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The root tsconfig.json is solution-style ("files": [], only
      # "references") -- `tsc --noEmit` against it checks zero files and
      # always exits 0, silently skipping every type error in the repo.
      # `--build` is the mode that actually traverses tsconfig.app.json and
      # tsconfig.node.json and checks their contents.
      - name: Type-check
        run: npx tsc --build --force

      - name: No stray platform/assistant-name references
        run: npm run check:no-platform-refs

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          VITE_SUPABASE_PROJECT_ID: "placeholder"

      - name: Report bundle size
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js | sort -rh | head -10 >> "$GITHUB_STEP_SUMMARY"

  edge-function-tests:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Supabase edge functions run on Deno, not Node, so they're tested
      # with Deno's own test runner rather than vitest. Scoped to *.test.ts
      # so it only loads the files that actually have tests -- index.ts
      # files without a sibling test file (e.g. cleanup-blocked-products,
      # whose logic is a thin wrapper around the already-tested shared
      # retry/run-log helpers) are never imported, so their npm:/esm.sh
      # specifiers don't need resolving here. --allow-net/--allow-env
      # cover resolving remote imports and the shared alerts helper's
      # Deno.env.get() calls (RESEND_API_KEY/SLACK_WEBHOOK_URL are unset
      # in CI, so it exercises the "not configured" path, not a real send).
      #
      # --no-check: this job never runs `npm ci`, so there's no
      # node_modules -- and @supabase/supabase-js's esm.sh type bundle
      # (pulled in transitively via realtime-js's use of `ws`) contains a
      # `/// <reference types="node" />` that Deno's type-checker can't
      # resolve without one. That's an interop gap in the dependency's
      # published types, not a problem with this repo's code, and it only
      # affects static type-checking -- the actual test assertions below
      # still run for real. Skip the check rather than adding an unrelated
      # npm install just to satisfy a transitive .d.ts reference.
      - name: Run edge function tests
        run: deno test --no-check --allow-net --allow-env supabase/functions/**/*.test.ts
