name: Deploy edge functions

# Why this exists
# ---------------
# Merging a new edge function to main did not deploy it. `engine-room-analyst`
# sat in the repository for a day while its cron job POSTed to it every three
# hours and got 404 back each time -- so the Engine Room's watch, the thing that
# is supposed to email before a bill arrives, was never once running. Nothing
# reported that, because a cron job firing `net.http_post` records "succeeded"
# the moment the request is queued; the 404 lands in a separate table nobody
# reads.
#
# Publishing the project deploys the site, not the functions, so the site kept
# looking healthy. The only thing that deployed functions was an AI agent
# remembering to, which is not a deployment process -- it is a habit, and it
# costs a credit every time.
#
# So: main is the source of truth, and merging is what deploys.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  # A second merge while the first is still deploying would race two versions of
  # the same function into the runtime. Latest wins; the older one is dropped
  # rather than queued, because it is already superseded.
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Warn and skip rather than fail. A red X on every merge for a repo
          # that has not been given the token teaches people to ignore red Xs,
          # and this workflow is only useful if its failures still mean
          # something. Same pattern as security.yml.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Edge functions NOT deployed — set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID repo secrets to enable automatic deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploys every function under supabase/functions. The CLI reads
          # supabase/config.toml for each one's verify_jwt setting, so the
          # webhook receivers that must stay open (payfast-webhook, yoco-webhook,
          # auth-email-hook) keep their existing configuration rather than being
          # silently locked behind a JWT check they were never designed to pass.
          supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "### ⚠️ Edge functions were not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Add these repo secrets to enable it (Settings → Secrets and variables → Actions):" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`SUPABASE_ACCESS_TOKEN\` — supabase.com → account → Access Tokens" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`SUPABASE_PROJECT_ID\` — the project ref from your Supabase URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Edge functions deployed from \`main\`" >> "$GITHUB_STEP_SUMMARY"
          fi
