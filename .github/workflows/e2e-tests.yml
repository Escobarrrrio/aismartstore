name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e 2>&1 | tee playwright-output.log
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-run-log
          path: playwright-output.log
          retention-days: 14

      - name: Report failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Playwright E2E tests failed"
            echo ""
            echo "Download the **playwright-report**, **playwright-test-results**, and **playwright-run-log** artifacts from this run for full logs, traces, screenshots, and videos."
            echo ""
            echo "### Last 100 lines of output"
            echo '```'
            tail -n 100 playwright-output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
