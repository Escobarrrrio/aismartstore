name: Lighthouse

on:
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://aismartstore.co.za/
            https://aismartstore.co.za/products
            https://aismartstore.co.za/ai-pulse
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 2

      - name: Report summary
        if: always()
        run: |
          {
            echo "## Lighthouse results"
            echo ""
            echo "Median scores per URL, plus a temporary public report link, are in the step output above."
            echo "Full HTML/JSON reports are attached as the **lighthouse-results** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
