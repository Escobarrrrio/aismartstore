name: Security Gate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Dependency audit (high+ severity fails the build)
        # `--severity` is not a real bun-audit flag -- it's silently ignored,
        # so this always fell back to failing on ANY vulnerability of ANY
        # severity (moderate/low included), not just high+ as the step name
        # promised. The flag that actually gates by threshold is
        # `--audit-level`.
        run: bun audit --prod --audit-level=high || (echo "::error::High-severity vulnerabilities detected" && exit 1)
      - name: Test suite
        run: bunx vitest run
      - name: Lint
        run: bunx eslint . --max-warnings=0 || true

  supabase-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Skipping Supabase security scan — set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID repo secrets to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Run database linter (warnings+ fail the build)
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase db lint --linked --level warning | tee lint.txt
          # CLI exits 0 even when findings exist; fail if any Level: warning/error rows are present.
          if grep -Eq '^Level: (warning|error)' lint.txt; then
            echo "::error::Supabase database linter reported unresolved findings — fix or acknowledge them before merging."
            exit 1
          fi

